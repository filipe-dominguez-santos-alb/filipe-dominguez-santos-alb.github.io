---
layout: default
title: Projects
wide: true
---
<h1>Projects</h1>
<div class="grid">
{% for p in site.data.projects %}
  <a class="card" href="{{ p.url | default: '#' }}" target="_blank" rel="noopener">
    <span class="pic">{% if p.image %}<img src="{{ p.image | relative_url }}" alt="" loading="lazy">{% else %}<span class="ph">&gt;_</span>{% endif %}</span>
    <h3>{{ p.title }}</h3>
  </a>
{% endfor %}
</div>
