title: ~/notes
description: Notes, write-ups and the graph that connects them.
baseurl: ""        # project repo? set to "/repo-name"
url: ""            # e.g. https://username.github.io
markdown: kramdown
permalink: /posts/:slug/
plugins:
  - jekyll-feed
  - jekyll-paginate
paginate: 10                 # posts per page on the home page
paginate_path: "/page:num/"
exclude:
  - README.md
