<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 150 }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
{% feed_meta %}
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="{{ '/' | relative_url }}">user@host:~$</a>
    <nav><a href="{{ '/' | relative_url }}">posts</a><a href="{{ '/graph/' | relative_url }}">graph</a><a href="{{ '/feed.xml' | relative_url }}">rss</a></nav>
  </header>
  <div class="cols{% if page.full_graph %} solo{% endif %}">
    <main>{{ content }}</main>
    {% unless page.full_graph %}
    <aside>
      <div class="mini">
        <canvas data-graph="mini" data-src="{{ '/graph.json' | relative_url }}" data-current="{{ page.slug }}" aria-label="Graph of posts and tags"></canvas>
        <a class="expand" href="{{ '/graph/' | relative_url }}">open full graph</a>
      </div>
    </aside>
    {% endunless %}
  </div>
  <footer>Powered by Jekyll on GitHub Pages.</footer>
</div>
<script src="{{ '/assets/graph.js' | relative_url }}"></script>
</body>
</html>
