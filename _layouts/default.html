<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080d0b"><title>{% if page.title and page.title != "Home" %}{{ page.title }} // {% endif %}{{ site.title }}</title><meta name="description" content="{{ page.description | default: site.description | escape }}"><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">{% feed_meta %}{% seo %}</head>
<body><div class="scanline" aria-hidden="true"></div><header class="site-header"><a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">[</span> {{ site.title }} <span class="brand-mark">]</span></a><nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}">Home</a><a href="{{ '/blog/' | relative_url }}">Blog</a><a href="{{ '/projects/' | relative_url }}">Projects</a><a href="{{ '/about/' | relative_url }}">About</a></nav></header><main class="site-main">{{ content }}</main><footer class="site-footer"><div><span class="status-dot"></span> SYSTEM ONLINE <span class="footer-divider">/</span> BUILT WITH CURIOSITY</div><div class="footer-right">© {{ 'now' | date: "%Y" }} {{ site.title }} · <a href="https://github.com/">GitHub</a></div></footer></body></html>
