---
layout: default
title: Tags
---
<h1>Tags</h1>
{% for t in site.tags %}
<section class="tagsec" id="{{ t[0] | slugify }}">
  <h2>#{{ t[0] }} <small>{{ t[1].size }}</small></h2>
  <ul class="taglist">
  {% for p in t[1] %}<li><time>{{ p.date | date: "%Y-%m-%d" }}</time><a href="{{ p.url | relative_url }}">{{ p.title }}</a></li>{% endfor %}
  </ul>
</section>
{% endfor %}
